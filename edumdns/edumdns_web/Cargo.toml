[package]
name = "edumdns_web"
version = "1.0.0"
edition = "2024"

[dependencies]
actix_web_openidconnect = { path = "../actix_web_openidconnect" }
actix-files = { version = "0.6.10" }
actix-multipart = "0.7.2"
regex = "1.13.1"
tokio-postgres = "0.7.18"
serde_json = "1.0.154"
actix-identity = "0.9.0"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-cors = "0.7.2"
actix-ws = "0.3.1"
minijinja = { version = "2.24.0", features = ["json", "serde_json", "default", "loader", "deserialization"] }
minijinja-autoreload = "2.24.0"
urlencoding = "2.1.3"
askama = "0.15.6"

edumdns_core = { workspace = true }
edumdns_db = { workspace = true }
edumdns_server = { workspace = true }
actix-web = { workspace = true }
log = { workspace = true }
itertools = { workspace = true }
serde = { workspace = true }
diesel-async = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
ipnetwork = { workspace = true }
time = { workspace = true }
futures-util = { workspace = true }
hickory-proto = { workspace = true }
strum = { workspace = true }



