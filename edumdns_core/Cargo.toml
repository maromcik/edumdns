[package]
name = "edumdns_core"
version = "1.0.2"
edition = "2024"

[dependencies]
pcap = {  version = "2.5.0", features = ["tokio", "lending-iter", "futures"]}
pnet = "0.35.0"
thiserror = "2.0.21"
bincode = "2.0.1"
serde = { version = "1.0.229", features = ["derive"] }
bytes = "1.12.1"
futures = "0.3.34"
log = "0.4.35"
ipnetwork = { version = "0.21.1"}
uuid = "1.29.0"
tokio = { version = "1.54.1", features = ["net", "bytes", "time"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
hickory-proto = { version = "0.25.2", features = ["default", "serde"]}
rustls = { version = "0.23.46", features = ["ring"] }
tokio-rustls = "0.26.6"
rustls-pki-types = "1.15.1"
