[package]
name = "edumdns_probe"
version = "1.2.3"
edition = "2024"
resolver = "3"

[dependencies]
edumdns_core = { path = "../edumdns_core" }
pcap = {  version = "2.5.0", features = ["tokio", "lending-iter", "futures"]}
pnet = "0.35.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "bytes", "time"] }
bincode = "2.0.1"
tokio-util = { version = "0.7.20", features = ["codec"] }
log = "0.4.35"
uuid = { version = "1.29.0", features = ["v7", "std", "serde"]}
dotenvy = "0.15.7"
tracing = { version = "0.1.44", features = ["async-await"]}
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time", "time"] }
rustls = "0.23.46"
webpki-roots = "1.0.11"
